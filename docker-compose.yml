services:
  api:
    build: .
    image: stroke-detection-ml:latest
    container_name: stroke-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    image: stroke-frontend:latest
    container_name: stroke-frontend
    depends_on:
      - api
    ports:
      - "8080:80"
