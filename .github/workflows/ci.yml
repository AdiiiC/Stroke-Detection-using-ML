name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check src api dashboard tests || true

      - name: Train a fast model (for API tests)
        run: |
          PYTHONPATH=src python -m stroke.run train --model logreg --trials 0 --no-calibrate

      - name: Run tests
        run: pytest -q -p no:warnings --cov=src/stroke --cov-report=term-missing
