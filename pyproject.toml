[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stroke-detection-ml"
version = "1.0.0"
description = "Leakage-safe, explainable, fair stroke-risk prediction with an optional CT/MRI imaging branch and late fusion."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Adithya C" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
